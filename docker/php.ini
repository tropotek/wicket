; Mounted into the container at $PHP_INI_DIR/conf.d/zz-wicket.ini.
; Edit and restart the container; no image rebuild needed.

; Uploads. Bump these when the wiki needs to accept larger attachments or
; images. post_max_size must stay above upload_max_filesize because the
; multipart body is slightly larger than the file itself.
upload_max_filesize = 26M
post_max_size = 28M

; One upload per request is the common case; the PHP default of 20 covers
; batch cases comfortably.
max_file_uploads = 20

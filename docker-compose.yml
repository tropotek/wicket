services:
  app:
    build: .
    image: wicket-dev:latest
    container_name: wicket-app
    working_dir: /app
    env_file: .env
    environment:
      OCTANE_SERVER: frankenphp
    ports:
      - "${APP_PORT:-8777}:${APP_PORT:-8777}"
    volumes:
      - ./:/app
    command: ["sh", "-c", "[ -d vendor ] || composer install --no-interaction --prefer-dist; php artisan octane:frankenphp --host=0.0.0.0 --port=${APP_PORT:-8777} --watch --workers=1 --max-requests=500"]
    tty: true

  vite:
    image: wicket-dev:latest
    depends_on:
      - app
    container_name: wicket-vite
    working_dir: /app
    env_file: .env
    ports:
      - "${VITE_PORT:-5173}:${VITE_PORT:-5173}"
    volumes:
      - ./:/app
    command: ["sh", "-c", "[ -d node_modules ] || npm install; npm run dev -- --host 0.0.0.0 --port ${VITE_PORT:-5173}"]
    tty: true
